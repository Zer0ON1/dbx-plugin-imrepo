name: Test and release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build every target and run the suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # Installs @dbx-app/plugin-cli, which bundles the Go SDK the sidecar
      # builds against.
      - name: Install tooling
        run: npm install --no-audit --no-fund

      # One runner cross-compiles all six targets: CGO_ENABLED=0 makes the
      # sidecar static, so it does not matter which libc the runner has.
      - name: Build packages (windows/linux/darwin x x64/arm64)
        run: python3 tools/build-packages.py

      # The preview harness is generated from ui/index.html; the UI test
      # renders that file, so it must be regenerated or it tests old markup.
      - name: Generate preview harness
        run: python3 tools/make-preview.py

      - name: Install a headless browser
        run: |
          curl -sSL -o /tmp/chs.zip https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.204/linux64/chrome-headless-shell-linux64.zip
          unzip -q /tmp/chs.zip -d /opt
          echo "CHROME_HEADLESS_SHELL=/opt/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"

      - name: Sidecar end-to-end tests
        run: |
          python3 tools/test-settings-e2e.py
          python3 tools/test-layers-e2e.py
          python3 tools/test-cleanup-e2e.py
          python3 tools/test-retag-e2e.py

      - name: Workbench UI tests
        run: python3 tools/test-ui-e2e.py

      - name: Colour-contrast gate
        run: python3 tools/check-contrast.py

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.dbxp
            dist/*.artifact.json
            dist/release-candidates.json

  release:
    name: Attach packages to the release
    needs: [test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      # The release carries one .dbxp per target plus release-candidates.json,
      # which is what dbx-store's auto-update workflow reads.
      - name: Upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -type f \( -name '*.dbxp' -o -name 'release-candidates.json' \) | while read -r f; do
            gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
          done
