name: Test and release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One runner cross-compiles all six targets (CGO_ENABLED=0 makes the sidecar
  # static, so the build host's libc is irrelevant). These exact bytes are what
  # the test matrix runs and what a release publishes.
  build:
    name: Build all six targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # Installs @dbx-app/plugin-cli, which bundles the Go SDK the sidecar builds
      # against.
      - name: Install tooling
        run: npm install --no-audit --no-fund

      - name: Build packages
        run: python3 tools/build-packages.py

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.dbxp
            dist/*.artifact.json
            dist/release-candidates.json

  # The only honest way to claim "works on Windows, Linux and macOS" is to run
  # the packaged sidecar on each of them. Every job tests the same artifact set
  # built above, so this also proves the cross-compiled bytes are the ones that
  # actually execute.
  test:
    name: Test on ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Belt and braces with tools/_harness.py's force_utf8_console(): Windows
      # consoles default to a legacy code page, and the suites print non-ASCII.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      # Format, architecture, code signature and the manifest's backend path, per
      # target. Reads the binaries rather than running them, so it works here too.
      - name: Package gate
        run: python tools/check-packages.py

      # These run the packaged sidecar of THIS host's target.
      - name: Sidecar suites
        run: |
          python tools/test-settings-e2e.py
          python tools/test-layers-e2e.py
          python tools/test-cleanup-e2e.py
          python tools/test-retag-e2e.py

      # Windows runners ship Edge and macOS runners ship Chrome; only Linux needs
      # one fetched. A missing browser makes the UI suite skip, never pass.
      - name: Install a headless browser
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o /tmp/chs.zip https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.204/linux64/chrome-headless-shell-linux64.zip
          unzip -q /tmp/chs.zip -d /opt
          echo "CHROME_HEADLESS_SHELL=/opt/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"

      - name: Workbench UI suite
        run: |
          python tools/make-preview.py
          python tools/test-ui-e2e.py

  # Static analysis: no sidecar involved, so one host is enough.
  gates:
    name: Contrast and translation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python tools/check-contrast.py
      - run: python tools/check-i18n.py

  release:
    name: Attach packages to the release
    needs: [build, test, gates]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      # The release carries one .dbxp per target plus release-candidates.json,
      # which is what dbx-store's auto-update workflow reads.
      - name: Upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -type f \( -name '*.dbxp' -o -name 'release-candidates.json' \) | while read -r f; do
            gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
          done
