name: Test and release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach packages to this existing release tag (leave blank for a test-only run)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # One runner cross-compiles all six targets (CGO_ENABLED=0 makes the sidecar
  # static, so the build host's libc is irrelevant). These exact bytes are what
  # the test matrix runs and what a release publishes.
  build:
    name: Build all six targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Off by default. The plugin CLI is the sidecar's SDK source, so the
          # install is on the critical path of every build; package-lock.json is
          # at the root, which is where the action looks.
          cache: "npm"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          # The module lives in backend/, so the action's default root-level
          # go.mod lookup finds nothing and skips caching entirely. Not a
          # failure, but it means six cross-compiles recompile the standard
          # library from scratch on every run.
          cache-dependency-path: backend/go.mod

      # Installs @dbx-app/plugin-cli, which bundles the Go SDK the sidecar builds
      # against.
      - name: Install tooling
        run: npm install --no-audit --no-fund

      - name: Build packages
        run: python3 tools/build-packages.py

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.dbxp
            dist/*.artifact.json
            dist/release-candidates.json

  # The only honest way to claim "works on Windows, Linux and macOS" is to run
  # the packaged sidecar on each of them. Every job tests the same artifact set
  # built above, so this also proves the cross-compiled bytes are the ones that
  # actually execute.
  test:
    name: Test on ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell_plat: linux64
          - os: windows-latest
            shell_plat: win64
          - os: macos-latest
            shell_plat: mac-arm64
    runs-on: ${{ matrix.os }}
    env:
      # Belt and braces with tools/_harness.py's force_utf8_console(): Windows
      # consoles default to a legacy code page, and the suites print non-ASCII.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      # Format, architecture, code signature and the manifest's backend path, per
      # target. Reads the binaries rather than running them, so it works here too.
      - name: Package gate
        run: python tools/check-packages.py

      # These run the packaged sidecar of THIS host's target.
      - name: Sidecar suites
        run: |
          python tools/test-settings-e2e.py
          python tools/test-layers-e2e.py
          python tools/test-cleanup-e2e.py
          python tools/test-retag-e2e.py
          python tools/test-mcp-e2e.py

      # The same headless shell on every platform, deliberately. Falling back to
      # the runner's own Chrome/Edge means the suite meets a different browser
      # implementation per OS, and a full browser driven by --headless=new is the
      # balky combination: on macOS it wrote nothing and never exited within the
      # harness's 180s limit. chrome-headless-shell is the old headless
      # implementation, where --dump-dom with a virtual time budget behaves.
      - name: Install chrome-headless-shell
        shell: bash
        env:
          PLAT: ${{ matrix.shell_plat }}
        run: |
          python - <<'PY'
          import io, os, pathlib, urllib.request, zipfile

          plat = os.environ["PLAT"]
          version = "131.0.6778.204"
          url = (f"https://storage.googleapis.com/chrome-for-testing-public/"
                 f"{version}/{plat}/chrome-headless-shell-{plat}.zip")
          archive = zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(url, timeout=180).read()))

          # Path handling is left to Python so the value written to GITHUB_ENV is
          # native for the runner (a Git-Bash path on Windows would not be).
          dest = pathlib.Path("chrome-headless-shell").resolve()
          archive.extractall(dest)
          exe = dest / f"chrome-headless-shell-{plat}" / (
              "chrome-headless-shell.exe" if plat.startswith("win") else "chrome-headless-shell")
          exe.chmod(0o755)

          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"CHROME_HEADLESS_SHELL={exe}\n")
          print("installed:", exe)
          PY

      - name: Workbench UI suite
        run: |
          python tools/make-preview.py
          python tools/test-ui-e2e.py

  # Static analysis: no sidecar involved, so one host is enough. The browser
  # baseline gate lives here too — it guards the sandbox UI on the oldest engine
  # DBX supports, which no runner in this matrix has.
  gates:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Colour contrast
        run: python tools/check-contrast.py

      - name: Translations
        run: python tools/check-i18n.py

      - name: Browser baseline (Chrome 109)
        run: python tools/check-browser-baseline.py

  release:
    name: Attach packages to the release
    needs: [build, test, gates]
    # Normally fired by publishing a release. The manual path exists because a
    # failed attach otherwise leaves no way to retry without cutting a release.
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      # The release carries one .dbxp per target plus release-candidates.json,
      # which is what dbx-store's auto-update workflow reads.
      - name: Upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo is required: this job has no checkout, so gh cannot find a git
          # remote to infer the repository from and fails with "not a git
          # repository". It did exactly that on the first release.
          #
          # A tag is not a release. `gh release upload` needs the release to
          # exist, and says only "release not found" when it does not — which
          # reads like a workflow bug rather than a missing step.
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::No release exists for tag $RELEASE_TAG. Publish it in the GitHub UI first (Releases → Draft a new release → choose the existing tag), then run this again — packages can only be attached to an existing release."
            exit 1
          fi
          find artifacts -type f \( -name '*.dbxp' -o -name 'release-candidates.json' \) | while read -r f; do
            gh release upload "$RELEASE_TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
